[workspace]
members = ["crates/shr-drums", "crates/shr-kit"]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
hound = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
